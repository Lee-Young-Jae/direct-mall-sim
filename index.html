<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>다이렉트몰 새 창 열기 시뮬레이터</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 24px; background: #f4f4f7; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; }
  p { font-size: 14px; color: #444; }
  button, a.btn { display: block; width: 100%; margin: 12px 0; padding: 14px 16px; font-size: 15px;
    border-radius: 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; text-align: left;
    text-decoration: none; color: #111; box-sizing: border-box; }
  small { color: #777; display: block; margin-top: 4px; font-weight: normal; }
  code { background: #e9e9ee; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .target { font-size: 12px; color: #555; word-break: break-all; background: #fff; border: 1px dashed #bbb;
    border-radius: 8px; padding: 10px 12px; }
</style>
</head>
<body>
<h1>다이렉트몰 새 창 열기 시뮬레이터</h1>
<p>다이렉트몰이 mobi 웹을 여는 방식을 재현합니다. 각 방식으로 연 뒤 결제 완료 화면에서
"다이렉트몰로 이동"을 눌러 <b>창이 닫히는지</b> 확인하세요.</p>

<div class="target">현재 target: <span id="t"></span><br />
다른 환경은 <code>?target=https://…/events/direct-mall</code> 쿼리로 지정</div>

<button onclick="window.open(TARGET)">
  1. window.open() — 스크립트로 새 창 열기
  <small>close() 항상 허용 (권장 방식)</small>
</button>

<a class="btn" href="#" target="_blank" id="blank">
  2. &lt;a target="_blank"&gt; — 링크 새 탭 열기
  <small>브라우저별 close() 허용 여부 확인 대상</small>
</a>

<a class="btn" href="#" target="_blank" rel="noopener noreferrer" id="noopener">
  3. &lt;a target="_blank" rel="noopener"&gt;
  <small>opener 차단 상태에서 close() 되는지 확인 대상</small>
</a>

<script>
  const TARGET = new URLSearchParams(location.search).get('target')
    || 'https://mobiesim.co.kr/events/direct-mall';
  document.getElementById('t').textContent = TARGET;
  document.getElementById('blank').href = TARGET;
  document.getElementById('noopener').href = TARGET;
</script>
</body>
</html>
